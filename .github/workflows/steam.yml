name: Aggiorna Steam Card

on:
  schedule:
    - cron: "0 0 * * *" # Aggiorna a mezzanotte
  workflow_dispatch:

jobs:
  update-steam-card:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Crea la cartella profile se non esiste
        run: mkdir -p profile

      - name: Scarica la Steam Card
        run: |
          curl -L "https://github-readme-steam-card.vercel.app/api/recent?steamid=76561198355665966" -o profile/steam.svg

      - name: Salva l'immagine nella repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/steam.svg
          git commit -m "Aggiornamento automatico Steam Card" || exit 0
          git push
